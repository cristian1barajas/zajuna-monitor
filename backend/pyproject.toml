[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "zajuna-monitor"
version = "0.1.0"
description = "Scraper for Zajuna (SENA Moodle) grading reports"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "python-docx>=0.8.11",
    "python-multipart>=0.0.6",
    "xlrd>=2.0",
    "Pillow>=10.0",
    "docx2pdf>=0.4",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I isort · B bugbear · UP pyupgrade ·
# SIM simplificaciones · C4 comprehensions
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "E501",  # líneas largas: las gestiona el formateador
    "B008",  # B008: patrón Depends() de FastAPI (falso positivo en defaults de endpoints)
    "UP042",  # UP042: migrar (str, Enum) a StrEnum cambia str()/format(); se mantiene por compatibilidad
]

[tool.ruff.format]
quote-style = "double"
